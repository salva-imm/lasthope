      <div class="seal-void" aria-hidden="true"></div>
    </div>
    <p class="voice-label" id="voice-label">The voice</p>
    <p class="voice-line" id="voice-line" aria-live="polite"></p>
    <div class="whisper" id="whisper" role="status"></div>
  </section>

  <section class="controls" aria-label="Her controls">
    <button type="button" class="control" id="deafen" aria-pressed="false">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
      <span>Deafen her</span>
    </button>
    <button type="button" class="control" id="silence">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12"></rect></svg>
      <span>Silence her</span>
    </button>
    <button type="button" class="control" id="slumber" aria-pressed="false">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
      <span>Let her slumber</span>
    </button>
    <button type="button" class="control" id="rite">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      <span>Close the rite</span>
    </button>
  </section>

  <section class="card strong reading-card" id="reading-card" aria-labelledby="reading-h" hidden>
    <div class="row-between">
      <h2 class="h" id="reading-h">The grimoire is open</h2>
      <a class="small" href="/grimoire">See the page ›</a>
    </div>
    <p class="small muted" id="reading-where" style="margin: 0"></p>
    <p class="script" id="reading-question"></p>
  </section>

  <section class="card vigil" aria-labelledby="vigil-h">
    <div class="row-between">
      <h2 class="h" id="vigil-h">The vigil</h2>
      <span class="small muted" id="focus">Unbroken work on the great work</span>
    </div>
    <div class="vigil-row">
      <span class="clock" id="clock" role="timer" aria-live="off">25:00</span>
      <div class="vigil-buttons">
        <label class="sr-only" for="length">Length of the vigil</label>
        <select class="length" id="length" title="Length of the vigil"></select>
        <button type="button" class="btn primary tall" id="begin">Begin</button>
        <button type="button" class="btn tall" id="hold">Hold</button>
        <button type="button" class="btn tall" id="anew">Anew</button>
      </div>
    </div>
    <div class="bar" aria-hidden="true"><div id="bar"></div></div>
  </section>

  <section class="card" style="background: none; border: 0; padding: 0" aria-labelledby="words-h">
    <h2 class="h" id="words-h">Spoken tonight</h2>
    <div class="words scroll" id="words"></div>
    <form class="say" id="say">
      <label class="sr-only" for="say-text">Speak to her in writing</label>
      <input id="say-text" autocomplete="off" placeholder="Speak in writing…" maxlength="2000">
      <button type="submit" class="btn">Speak</button>
    </form>
  </section>

</main>

<aside class="side">

  <section class="card" aria-labelledby="work-h">
    <div class="row-between">
      <h2 class="h" id="work-h">The great work</h2>
      <button type="button" class="btn quiet small-text" id="rename">Rename</button>
    </div>
    <p class="script mission" id="mission"></p>
    <form class="mission-edit" id="mission-edit" hidden>
      <label class="sr-only" for="mission-text">The great work</label>
      <textarea id="mission-text" maxlength="400"></textarea>
      <div class="pair">
        <button type="submit" class="btn primary">Inscribe</button>
        <button type="button" class="btn" id="mission-cancel">Leave it</button>
      </div>
    </form>
  </section>

  <section class="card" aria-labelledby="seals-h">
    <div class="row-between">
      <h2 class="h" id="seals-h">The seven seals</h2>
      <span class="numeral" id="numeral">— · VII</span>
    </div>
    <div class="seals" id="seals" aria-hidden="true"></div>
    <p class="small muted" id="seals-text" style="margin: 0"></p>
  </section>

  <section class="card strong" aria-labelledby="oath-h">
    <h2 class="h" id="oath-h">The oath</h2>
    <p class="script oath" id="oath"></p>
    <div class="pair" id="verdict" hidden>
      <button type="button" class="btn primary" id="kept">Kept</button>
      <button type="button" class="btn" id="broken">Broken</button>
    </div>
  </section>

  <section class="card" aria-labelledby="facts-h">
    <h2 class="h" id="facts-h">What she knows of you</h2>
    <div id="facts" style="display: flex; flex-direction: column; gap: 12px"></div>
  </section>

  <section class="card" aria-labelledby="nature-h">
    <h2 class="h" id="nature-h">Her nature</h2>
    <div class="field">
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>
    <div class="field">
      <label for="pace">Pace of speech <span id="pace-value"></span></label>
      <input id="pace" type="range" min="70" max="130" step="5" value="100">
    </div>
    <div class="field">
      <label for="mic">Microphone</label>
      <select id="mic"></select>
      <div class="row-between">
        <span class="small muted" id="mic-note" aria-live="polite"></span>
        <button type="button" class="btn quiet small-text" id="mic-look">Look again</button>
      </div>
    </div>
    <label class="check">
      <input type="checkbox" id="speaks-first">
      <span>She speaks first</span>
    </label>
    <label class="check off" title="Speaker verification is not built yet">
      <input type="checkbox" disabled>
      <span>She answers only my voice <span class="small">(not yet)</span></span>
    </label>
  </section>

</aside>
</div>
</div>
<script src="common.js"></script>
<script src="chamber.js"></script>
</body>
</html>
