[package]
name = "lasthope"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.32.0", features = ["full"] }
kalosm = { version = " 0.4.0", features = ["sound", "metal"] }
#sherpa-rs = { version = "0.6.6", features = ["tts", "static", "download-binaries"] }
sherpa-rs = { git = "https://github.com/thewh1teagle/sherpa-rs", branch = "main", features = ["static", "download-binaries", "tts"]}
rodio = "0.21.1"
anyhow = "1.0.98"
serde = { version = "1.0.219", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures = "0.3.31"
serde_json = "1.0.142"
futures-util = "0.3.31"
hound = "3.5.1"